name: Build and deploy

# Builds the site from src/ with Eleventy, then publishes the built pages to:
#   - the live server by FTP/FTPS (coastlinesafetyservices.co.uk)
#   - GitHub Pages (the preview copy)
#
# - Runs automatically when a pull request is merged into main (a push to main).
# - Can also be run by hand from the Actions tab ("Run workflow"). A manual run is
#   a DRY RUN by default: it builds the site and lists what would change on the
#   server, but uploads nothing. Untick "Dry run" to publish for real.
#
# Server details are kept in GitHub secrets, never in this file. See docs/deploy.md.

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".github/pull_request_template.md"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build and list what would change, publish nothing)"
        type: boolean
        default: true

# Never run two deployments at once.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Eleventy
        run: npm ci

      - name: Build the pages into _site
        run: npx eleventy

      - name: Keep the built site for the server upload
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          retention-days: 7

      - name: Package the built site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy-server:
    name: Upload to live server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site/

      - name: Check the server settings exist
        id: config
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Server settings (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD) are not set, so nothing was uploaded. See docs/deploy.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get the .htaccess merge script
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          path: repo

      # HTTPS redirect and HSTS header. The server already has a .htaccess (from
      # WordPress and possibly the host, such as the PHP version), so download it,
      # add our rules in a marked section at the top, keep everything else, and
      # upload the result with the site. If it cannot be read, stop rather than
      # risk replacing it. The file's contents are never printed (public log).
      - name: Add HTTPS rules to the server's .htaccess
        if: steps.config.outputs.configured == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || './' }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
        run: |
          dir="${FTP_SERVER_DIR#./}"
          if [ "$FTP_PROTOCOL" = "ftp" ]; then tls=""; else tls="--ssl-reqd"; fi
          set +e
          curl --silent --show-error $tls --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "ftp://$FTP_SERVER/${dir}.htaccess" -o existing.htaccess
          code=$?
          set -e
          if [ "$code" -eq 78 ]; then
            : > existing.htaccess
            echo "The server has no .htaccess yet."
          elif [ "$code" -ne 0 ]; then
            echo "::error::Could not read the server's .htaccess (curl exit code $code), so nothing was uploaded."
            exit 1
          fi
          python3 repo/.github/scripts/merge_htaccess.py existing.htaccess _site/.htaccess
          rm -f existing.htaccess

      - name: Upload to the server
        if: steps.config.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./_site/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          # Only the built site is uploaded. Files already on the server that this
          # workflow did not upload (for example WordPress) are left alone.

  deploy-pages:
    name: Publish GitHub Pages preview
    needs: build
    # Skip on a manual dry run.
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
